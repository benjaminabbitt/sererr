# Generates C# proto bindings into Generated/.
#
# Run via: just proto-gen (or buf generate from this directory).
#
# Managed mode overrides `csharp_namespace` so the proto-generated
# classes (StackFrame / CapturedError / ExceptionMechanism) sit at
# `Sererr.V1.*` and don't collide with the plain types we expose at
# `Sererr.*` for the public API.
version: v2
managed:
  enabled: true
  override:
    - file_option: csharp_namespace
      value: Sererr.V1
      path: sererr/v1/sererr.proto
plugins:
  - remote: buf.build/protocolbuffers/csharp
    out: Generated
