[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sererr"
version = "0.1.0"
description = "Sentry-compat structured stack-trace + error-chain capture."
authors = [{name = "sererr contributors"}]
license = {text = "MIT OR BSD-3-Clause"}
requires-python = ">=3.10"
keywords = ["error", "stack-trace", "sentry", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "protobuf>=4.25,<7",
]

[project.urls]
Homepage = "https://sererr.fyi"
Repository = "https://github.com/sererr/sererr"
Documentation = "https://sererr.fyi/docs/python"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",         # coverage during pytest runs
    "mutmut>=2.5",           # mutation testing
    "grpcio-tools>=1.60",    # for proto regen
]

[tool.coverage.run]
source = ["src/sererr"]
omit = ["src/sererr/proto/_gen/*"]  # exclude buf-generated code

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mutmut]
paths_to_mutate = "src/sererr/"
runner = "python -m pytest -x -q"
tests_dir = "tests/"

[tool.hatch.build.targets.wheel]
packages = ["src/sererr"]

# Optional: include source files for context_line population.
# When the producer ships source-bundled captures, this packages source
# at install time. Producers opt into bundling their own source via the
# capture API rather than via this package's data.
