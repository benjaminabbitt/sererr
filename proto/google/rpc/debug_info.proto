// Subset of google/rpc/error_details.proto, vendored here so the sererr
// Rust crate's ToDebugInfo adapter produces a wire-compatible
// google.rpc.DebugInfo without depending on the full googleapis bundle.
//
// Source: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto
// License: Apache 2.0 — see the upstream file. We replicate only the
// DebugInfo message and keep the package name `google.rpc` so generated
// types serialize byte-equivalent to the upstream definition.

syntax = "proto3";
package google.rpc;

option csharp_namespace = "Google.Rpc";
option go_package = "google.golang.org/genproto/googleapis/rpc/errdetails;errdetails";
option java_multiple_files = true;
option java_package = "com.google.rpc";

// Describes additional debugging info.
//
// Wire-compatible with the upstream google.rpc.DebugInfo. Sererr's
// per-language adapters produce values of this shape.
message DebugInfo {
  // The stack trace entries indicating where the error occurred, one
  // line per frame, most-recent-call-first.
  repeated string stack_entries = 1;

  // Additional debugging information provided by the server.
  string detail = 2;
}
